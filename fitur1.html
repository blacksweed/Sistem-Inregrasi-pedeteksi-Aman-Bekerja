<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIPAB | Deteksi Atribut Pekerja</title>
  <link rel="stylesheet" href="fitur1.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="fitur-header">
    <img src="logo-sipab.png" alt="Logo SIPAB" class="fitur-logo" />
    <h1 class="fitur-title">Deteksi Atribut Pekerja</h1>
  </header>

  <main class="fitur-container">
    <section class="kamera-feed">
      <h2>Hasil Deteksi Kamera</h2>
      <img src="Camera deteksi drone, tidak memkai helm.jpg" alt="Deteksi Kamera" class="kamera-img" />
      <p class="keterangan">⚠️ Pekerja terdeteksi tidak menggunakan helm.</p>
    </section>

    <section class="atribut-status">
      <h2>Status Atribut</h2>
      <div class="atribut-grid">
        <div class="atribut-item">
          <img src="Helm.jpg" alt="Helm" />
          <p class="status merah">Tidak Terdeteksi</p>
        </div>
        <div class="atribut-item">
          <img src="Sepatu.jpg" alt="Sepatu" />
          <p class="status hijau">Terdeteksi</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
