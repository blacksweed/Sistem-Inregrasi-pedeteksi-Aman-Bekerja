<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPAB | Fitur 3 - Tombol Darurat</title>
  <link rel="stylesheet" href="fitur3.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="fitur-container">
    <h1>🔴 Tombol Darurat</h1>

    <div class="emergency-section">
      <p>Tekan tombol ini dalam kondisi darurat untuk mengirimkan peringatan ke sistem pengawas.</p>
      <button id="emergency-button" class="emergency-button">
        <i class="fas fa-exclamation-triangle"></i> Aktifkan Tombol Darurat
      </button>
    </div>

    <div id="notification" class="notification hidden">
      ⚠️ Peringatan darurat telah dikirim ke pusat pengawasan!
    </div>
  </div>

  <script src="fitur3.js"></script>
</body>
</html>
